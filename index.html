<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>타임라인 이동 시각화</title>

  <!-- Leaflet 지도 -->
  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
  />

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f5f5f5;
    }

    #map {
      width: 100%;
      height: 75vh;
    }

    #controls {
      background: white;
      padding: 14px;
      box-shadow: 0 -2px 8px rgba(0,0,0,0.15);
    }

    button {
      border: none;
      border-radius: 8px;
      padding: 11px 16px;
      margin-right: 6px;
      margin-bottom: 8px;
      background: #222;
      color: white;
      font-size: 15px;
      cursor: pointer;
    }

    button:active {
      transform: scale(0.97);
    }

    #time {
      font-size: 14px;
      margin: 5px 0 10px;
      color: #333;
    }

    #progress {
      width: 100%;
    }

    #speed {
      padding: 8px;
      border-radius: 6px;
      border: 1px solid #ccc;
      font-size: 14px;
    }

    #status {
      font-size: 13px;
      color: #666;
      margin-top: 8px;
    }
  </style>
</head>

<body>

<div id="map"></div>

<div id="controls">

  <button id="playBtn">▶ 재생</button>
  <button id="pauseBtn">⏸ 일시정지</button>
  <button id="resetBtn">↺ 처음으로</button>

  <select id="speed">
    <option value="0.5">0.5배속</option>
    <option value="1" selected>1배속</option>
    <option value="2">2배속</option>
    <option value="5">5배속</option>
    <option value="10">10배속</option>
    <option value="20">20배속</option>
  </select>

  <div id="time">데이터를 불러오는 중...</div>

  <input
    type="range"
    id="progress"
    min="0"
    max="100"
    value="0"
  >

  <div id="status"></div>

</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>

  /*
   * 같은 GitHub 저장소에 있는
   * 타임라인.json 파일을 불러옵니다.
   */
  const JSON_URL = "./타임라인.json";

  let points = [];
  let currentIndex = 0;
  let playing = false;
  let animationFrame = null;
  let lastTime = null;

  /*
   * 지도 생성
   */
  const map = L.map("map");

  L.tileLayer(
    "https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",
    {
      attribution: '&copy; OpenStreetMap contributors'
    }
  ).addTo(map);

  /*
   * 이동 경로
   */
  let routeLine = null;

  /*
   * 현재 위치 표시용 마커
   */
  const movingMarker = L.circleMarker([0, 0], {
    radius: 8,
    weight: 3,
    fillOpacity: 1
  });

  /*
   * JSON에서 좌표를 읽는 함수
   */
  function parsePoint(point) {

    if (!point) {
      return null;
    }

    /*
     * 현재 JSON 구조:
     * "point": "37.3548009, 127.9205804"
     */
    if (typeof point === "string") {

      const parts = point.split(",");

      if (parts.length >= 2) {

        const lat = parseFloat(parts[0].trim());
        const lng = parseFloat(parts[1].trim());

        if (
          Number.isFinite(lat) &&
          Number.isFinite(lng)
        ) {
          return [lat, lng];
        }
      }
    }

    /*
     * 혹시 배열 형태의 좌표가 들어있는 경우
     */
    if (Array.isArray(point) && point.length >= 2) {

      const lat = parseFloat(point[0]);
      const lng = parseFloat(point[1]);

      if (
        Number.isFinite(lat) &&
        Number.isFinite(lng)
      ) {
        return [lat, lng];
      }
    }

    return null;
  }


  /*
   * JSON 데이터 불러오기
   */
  async function loadData() {

    try {

      const response = await fetch(JSON_URL);

      if (!response.ok) {
        throw new Error(
          "JSON 파일을 불러오지 못했습니다."
        );
      }

      const data = await response.json();

      const segments =
        data.semanticSegments || [];

      /*
       * 모든 timelinePath를 하나로 합칩니다.
       */
      const allPoints = [];

      for (const segment of segments) {

        if (!Array.isArray(segment.timelinePath)) {
          continue;
        }

        for (const item of segment.timelinePath) {

          const position =
            parsePoint(item.point);

          const time =
            new Date(item.time);

          if (
            position &&
            !Number.isNaN(time.getTime())
          ) {

            allPoints.push({
              lat: position[0],
              lng: position[1],
              time: time
            });

          }
        }
      }

      /*
       * 시간순으로 정렬
       */
      allPoints.sort(
        (a, b) => a.time - b.time
      );

      /*
       * 같은 위치가 계속 반복되는 데이터도
       * 그대로 유지해서 실제 이동 시간을 보존합니다.
       */
      points = allPoints;

      if (points.length === 0) {

        document.getElementById("status").textContent =
          "timelinePath에서 좌표를 찾지 못했습니다.";

        return;
      }

      /*
       * 지도 범위 설정
       */
      const bounds =
        L.latLngBounds(
          points.map(p => [p.lat, p.lng])
        );

      map.fitBounds(bounds, {
        padding: [30, 30]
      });

      /*
       * 이동 경로 표시
       */
      routeLine = L.polyline(
        points.map(p => [p.lat, p.lng]),
        {
          weight: 4,
          opacity: 0.7
        }
      ).addTo(map);

      /*
       * 첫 위치 표시
       */
      movingMarker
        .setLatLng([
          points[0].lat,
          points[0].lng
        ])
        .addTo(map);

      currentIndex = 0;

      updateDisplay();

      document.getElementById("status").textContent =
        "총 " + points.length.toLocaleString() +
        "개의 위치 좌표를 불러왔습니다.";

    } catch (error) {

      console.error(error);

      document.getElementById("status").textContent =
        "JSON을 불러오는 중 오류가 발생했습니다: " +
        error.message;
    }
  }


  /*
   * 화면의 시간 표시
   */
  function updateDisplay() {

    if (points.length === 0) {
      return;
    }

    const p = points[currentIndex];

    movingMarker.setLatLng([
      p.lat,
      p.lng
    ]);

    document.getElementById("time").textContent =
      p.time.toLocaleString("ko-KR");

    document.getElementById("progress").value =
      (currentIndex / (points.length - 1)) * 100;
  }


  /*
   * 재생
   */
  function play() {

    if (points.length < 2) {
      return;
    }

    if (playing) {
      return;
    }

    /*
     * 이미 마지막이면 처음부터
     */
    if (currentIndex >= points.length - 1) {
      currentIndex = 0;
    }

    playing = true;
    lastTime = null;

    animationFrame =
      requestAnimationFrame(animate);
  }


  /*
   * 애니메이션
   */
  function animate(timestamp) {

    if (!playing) {
      return;
    }

    if (lastTime === null) {
      lastTime = timestamp;
    }

    const elapsed =
      timestamp - lastTime;

    const speed =
      parseFloat(
        document.getElementById("speed").value
      );

    /*
     * 실제 데이터의 시간 차이를 사용합니다.
     *
     * 너무 긴 실제 시간 차이를 그대로 기다리면
     * 영상처럼 보기 어렵기 때문에
     * 1배속 기준 약 20ms~100ms 정도의
     * 빠른 재생으로 표시합니다.
     */
    const step =
      Math.max(
        1,
        Math.floor(elapsed * speed / 30)
      );

    if (elapsed >= 30) {

      currentIndex += step;

      lastTime = timestamp;

      if (
        currentIndex >= points.length - 1
      ) {

        currentIndex =
          points.length - 1;

        updateDisplay();

        playing = false;

        document.getElementById("playBtn")
          .textContent = "▶ 다시 재생";

        return;
      }

      updateDisplay();
    }

    animationFrame =
      requestAnimationFrame(animate);
  }


  /*
   * 일시정지
   */
  function pause() {

    playing = false;

    if (animationFrame) {
      cancelAnimationFrame(animationFrame);
    }
  }


  /*
   * 처음으로
   */
  function reset() {

    pause();

    currentIndex = 0;

    updateDisplay();

    if (points.length > 0) {

      map.setView(
        [
          points[0].lat,
          points[0].lng
        ],
        map.getZoom()
      );
    }

    document.getElementById("playBtn")
      .textContent = "▶ 재생";
  }


  /*
   * 슬라이더로 직접 이동
   */
  document.getElementById("progress")
    .addEventListener("input", function() {

      if (points.length === 0) {
        return;
      }

      pause();

      const ratio =
        parseFloat(this.value) / 100;

      currentIndex =
        Math.round(
          ratio * (points.length - 1)
        );

      updateDisplay();
    });


  /*
   * 버튼 이벤트
   */
  document.getElementById("playBtn")
    .addEventListener("click", play);

  document.getElementById("pauseBtn")
    .addEventListener("click", pause);

  document.getElementById("resetBtn")
    .addEventListener("click", reset);


  /*
   * JSON 불러오기 시작
   */
  loadData();

</script>

</body>
</html>
